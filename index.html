<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>doNotLiveInPoems | v1.7</title>
    <!-- 引入 Google Fonts: Chiron Sung HK -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chiron+Sung+HK&display=swap" rel="stylesheet">
    <!-- 引入 Matter.js 物理引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #313131; /* 網頁底色修改為深色 */
            touch-action: none; /* 防止在手機上滑動畫面 */
            font-family: 'Chiron Sung HK', serif;
        }
        #world {
            display: block;
            width: 100%;
            height: 100%;
            transition: opacity 0.25s ease-in-out; /* 新增漸變過渡 */
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #e584b4; /* 文字顏色修改為粉色 */
            font-size: 24pt;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #313131;
            z-index: 100;
            display: none; /* 預設隱藏，等字型載入後顯示 */
            justify-content: center;
            align-items: center;
            color: #e584b4;
            font-size: 20pt;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <div id="loading">載入中...</div>
    <div id="start-overlay">《#請勿活在詩裡》</div>
    <canvas id="world"></canvas>

    <script>
        // 初始化 Matter.js 模組
        const Engine = Matter.Engine,
              Render = Matter.Render,
              Runner = Matter.Runner,
              Bodies = Matter.Bodies,
              Composite = Matter.Composite,
              Constraint = Matter.Constraint,
              Mouse = Matter.Mouse,
              MouseConstraint = Matter.MouseConstraint,
              Events = Matter.Events,
              Body = Matter.Body;

        const engine = Engine.create();
        const world = engine.world;

        // 修正：將物理引擎的預設重力設定與陀螺儀的小重力同步，避免初始載入時過度拉扯下墜
        engine.gravity.x = 0;
        engine.gravity.y = 0.2;

        const canvas = document.getElementById('world');
        const ctx = canvas.getContext('2d');

        // 詩句資料
        const originalSentences = [
            "雨水直接打進眼睛",
            "陽光普照得沒有陰影",
            "面朝大海，春暖花開",
            "難就難在生命",
            "並非詩句",
            "明明　還有更重要的事情",
            "我每天想著的淨是",
            "昨日的天氣"
        ];

        let linesData = [];
        let currentOrder = [0, 1, 2, 3, 4, 5, 6, 7];

        // 判斷是否為手機版並設定文字大小與間距
        const isMobile = window.innerWidth <= 768;
        const ptToPx = 1.3333; // 1pt 約等於 1.3333px
        const fontSizePt = isMobile ? 18 : 20; 
        const fontSize = fontSizePt * ptToPx; // 轉換為 px
        const lineGap = isMobile ? 22 : 28; // 句子間隔
        const colWidth = fontSize + lineGap;

        // 初始化場景
        function init() {
            // 建立每個字元的物理剛體與約束 (繩索效果)
            for (let i = 0; i < originalSentences.length; i++) {
                let text = originalSentences[i];
                let bodies = [];
                let constraints = [];
                let prevBody = null;

                for (let j = 0; j < text.length; j++) {
                    let char = text[j];
                    
                    // 建立物理節點
                    let body = Bodies.circle(0, j * fontSize, fontSize * 0.45, {
                        collisionFilter: { group: -1 }, // 設為同群組且負數值，讓所有字不互碰以避免糾纏
                        frictionAir: 0.05, // 稍微增加一點空氣阻力讓擺動柔順
                        restitution: 0.1, // 降低彈性
                        isStatic: j === 0 // 第一個字固定不動
                    });
                    body.char = char;
                    bodies.push(body);
                    Composite.add(world, body);

                    // 綁定繩子(關節)
                    if (prevBody) {
                        let constraint = Constraint.create({
                            bodyA: prevBody,
                            bodyB: body,
                            length: fontSize * 0.9,
                            stiffness: 1, // 修改：設定極高硬度以防止字距拉長
                            damping: 0.1 // 提高阻尼避免抖動
                        });
                        constraints.push(constraint);
                        Composite.add(world, constraint);
                    }
                    prevBody = body;
                }
                linesData.push({ bodies, constraints });
            }

            // 加入滑鼠與觸控拖曳控制
            const mouse = Mouse.create(canvas);
            const mouseConstraint = MouseConstraint.create(engine, {
                mouse: mouse,
                constraint: {
                    stiffness: 0.05, // 修改：滑鼠拉力調弱，確保拖曳時「繩子(1.0)」比「滑鼠(0.05)」硬，字距才不會被拉扯開
                    render: { visible: false }
                }
            });
            Composite.add(world, mouseConstraint);

            // 處理 Retina 高解析度螢幕的滑鼠座標修正
            const pixelRatio = window.devicePixelRatio || 1;
            mouse.pixelRatio = pixelRatio;

            // 辨識「點擊」與「拖曳」的差別
            let dragStartPos = null;
            Events.on(mouseConstraint, 'mousedown', function(event) {
                dragStartPos = { x: event.mouse.position.x, y: event.mouse.position.y };
            });
            
            Events.on(mouseConstraint, 'mouseup', function(event) {
                if (!dragStartPos) return;
                let dx = event.mouse.position.x - dragStartPos.x;
                let dy = event.mouse.position.y - dragStartPos.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                
                // 如果移動距離很短，判定為點擊，則亂數打亂順序
                if (dist < 10) {
                    handleScreenClick();
                }
                dragStartPos = null;
            });

            // 初始佈局更新
            updateLayout();
            window.addEventListener('resize', updateLayout);

            // 加入微風效果與拖曳角度限制
            let windTime = 0;
            Events.on(engine, 'beforeUpdate', function() {
                windTime += 0.02;
                // 隨機微風力道 (由兩個正弦波疊加)，力道調弱至四分之一
                let windForceX = (Math.sin(windTime) * 0.0003 + Math.sin(windTime * 2.1) * 0.00015) * 0.25;
                let maxStretch = fontSize * 0.95; // 限制最大長度

                for (let line of linesData) {
                    let bodies = line.bodies;
                    for (let j = 1; j < bodies.length; j++) {
                        let prev = bodies[j-1];
                        let curr = bodies[j];

                        // --- 1. 施加隨機微風 ---
                        // 越下方的字元受風力影響越大
                        let forceMultiplier = j / bodies.length;
                        Matter.Body.applyForce(curr, curr.position, {
                            x: windForceX * forceMultiplier * curr.mass,
                            y: 0
                        });

                        // --- 2. 限制拖曳角度 (不可超過 60 度) 與 強制防拉長 ---
                        let dx = curr.position.x - prev.position.x;
                        let dy = curr.position.y - prev.position.y;
                        let angle = Math.atan2(dy, dx);
                        let dist = Math.sqrt(dx*dx + dy*dy);

                        // 基準向下為 Math.PI/2，左右各 60 度 (即 PI/3)
                        let minAngle = Math.PI / 2 - Math.PI / 3; 
                        let maxAngle = Math.PI / 2 + Math.PI / 3;

                        let clampedAngle = angle;
                        if (dy < 0) {
                            // 若被往上拉，強制限縮在 60 度邊緣
                            clampedAngle = dx > 0 ? minAngle : maxAngle;
                        } else if (angle < minAngle) {
                            clampedAngle = minAngle;
                        } else if (angle > maxAngle) {
                            clampedAngle = maxAngle;
                        }

                        let clampedDist = Math.min(dist, maxStretch);

                        // 若角度或距離被限制，強制覆寫位置
                        if (clampedAngle !== angle || dist > clampedDist) {
                            Matter.Body.setPosition(curr, {
                                x: prev.position.x + Math.cos(clampedAngle) * clampedDist,
                                y: prev.position.y + Math.sin(clampedAngle) * clampedDist
                            });
                            // 稍微降低速度以減少因強制位移產生的物理抖動
                            Matter.Body.setVelocity(curr, { x: curr.velocity.x * 0.8, y: curr.velocity.y * 0.8 });
                        }
                    }
                }
            });

            // 啟動物理引擎計算與自定義繪製
            Runner.run(Runner.create(), engine);
            requestAnimationFrame(renderLoop);
        }

        // 陣列亂數排序 (Fisher-Yates Shuffle)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // 點擊螢幕觸發功能 (包含要求 iOS 陀螺儀權限)
        function handleScreenClick() {
            // 加入淡出淡入轉場效果 (Fade out 保持 0.25s -> Shuffle -> Fade in 延長為 0.5s)
            canvas.style.transitionDuration = '0.25s';
            canvas.style.opacity = '0';
            setTimeout(() => {
                shuffleArray(currentOrder);
                updateLayout();
                canvas.style.transitionDuration = '0.5s';
                canvas.style.opacity = '1';
            }, 250); // 250ms 消失後執行
        }

        // 陀螺儀重力處理
        function handleOrientation(event) {
            let gamma = event.gamma || 0; // 左右傾斜
            let beta = event.beta || 0;  // 前後傾斜

            let gx = gamma / 45; 
            let gy = beta / 45;

            // 調整門簾擺動的靈敏度與最大值
            gx = Math.max(-1.5, Math.min(1.5, gx));
            gy = Math.max(-1.5, Math.min(1.5, gy));

            engine.world.gravity.x = gx * 1.5;
            // 確保重力大致向下，避免整個飛上去
            engine.world.gravity.y = gy > 0 ? Math.max(0.2, gy * 1.5) : 0.2; 
        }

        // 根據直/橫畫面重新排列所有詩句的定位
        function updateLayout() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const pixelRatio = window.devicePixelRatio || 1;

            // 設定 Canvas 高清解析度
            canvas.width = w * pixelRatio;
            canvas.height = h * pixelRatio;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            ctx.scale(pixelRatio, pixelRatio);

            let isPortrait = h >= w;

            if (!isPortrait) {
                // 橫畫面：8句集中於正中央
                let totalCols = 8;
                let totalWidth = totalCols * fontSize + (totalCols - 1) * lineGap;
                let maxLen = Math.max(...currentOrder.map(i => originalSentences[i].length));
                let blockHeight = maxLen * fontSize;

                let startX = w / 2 + totalWidth / 2 - fontSize / 2;
                let startY = h / 2 - blockHeight / 2 + fontSize / 2;

                for (let i = 0; i < 8; i++) {
                    let lineIdx = currentOrder[i];
                    let targetX = startX - i * colWidth;
                    let targetY = startY;
                    moveLine(lineIdx, targetX, targetY);
                }
            } else {
                // 直畫面：上下兩半，各4句
                // 上半部 4 句
                let topGroup = currentOrder.slice(0, 4);
                let maxLenTop = Math.max(...topGroup.map(i => originalSentences[i].length));
                let topBlockHeight = maxLenTop * fontSize;
                let topTotalWidth = 4 * fontSize + 3 * lineGap;
                let topStartX = w / 2 + topTotalWidth / 2 - fontSize / 2;
                let topStartY = h / 4 - topBlockHeight / 2 + fontSize / 2;

                for (let i = 0; i < 4; i++) {
                    let lineIdx = topGroup[i];
                    let targetX = topStartX - i * colWidth;
                    let targetY = topStartY;
                    moveLine(lineIdx, targetX, targetY);
                }

                // 下半部 4 句
                let botGroup = currentOrder.slice(4, 8);
                let maxLenBot = Math.max(...botGroup.map(i => originalSentences[i].length));
                let botBlockHeight = maxLenBot * fontSize;
                let botTotalWidth = 4 * fontSize + 3 * lineGap;
                let botStartX = w / 2 + botTotalWidth / 2 - fontSize / 2;
                let botStartY = (h * 3) / 4 - botBlockHeight / 2 + fontSize / 2;

                for (let i = 0; i < 4; i++) {
                    let lineIdx = botGroup[i];
                    let targetX = botStartX - i * colWidth;
                    let targetY = botStartY;
                    moveLine(lineIdx, targetX, targetY);
                }
            }
        }

        // 平順地將整句移動到新位置 (避免約束爆炸)
        function moveLine(lineIdx, targetX, targetY) {
            let bodies = linesData[lineIdx].bodies;
            let anchor = bodies[0];
            let dx = targetX - anchor.position.x;
            let dy = targetY - anchor.position.y;

            for (let body of bodies) {
                Body.setPosition(body, {
                    x: body.position.x + dx,
                    y: body.position.y + dy
                });
                Body.setVelocity(body, { x: 0, y: 0 }); // 消除亂數調換時產生的暴衝速度
                Body.setAngularVelocity(body, 0);
            }
        }

        // 自定義畫面繪製
        function renderLoop() {
            const w = window.innerWidth;
            const h = window.innerHeight;

            ctx.clearRect(0, 0, w, h);

            // 文字繪製設定
            ctx.font = `400 ${fontSizePt}pt "Chiron Sung HK", serif`;
            ctx.fillStyle = '#e584b4'; // 文字顏色修改為粉色
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            for (let line of linesData) {
                let bodies = line.bodies;
                for (let j = 0; j < bodies.length; j++) {
                    let body = bodies[j];
                    let angle = 0;
                    
                    // 根據上下文字的相對位置計算旋轉角度，讓文字順著繩子方向排，看起來更柔順
                    if (j < bodies.length - 1) {
                        let nextBody = bodies[j+1];
                        angle = Math.atan2(nextBody.position.y - body.position.y, nextBody.position.x - body.position.x) - Math.PI / 2;
                    } else if (j > 0) {
                        let prevBody = bodies[j-1];
                        angle = Math.atan2(body.position.y - prevBody.position.y, body.position.x - prevBody.position.x) - Math.PI / 2;
                    }

                    ctx.save();
                    ctx.translate(body.position.x, body.position.y);
                    // 將繩索角度與自身物理旋轉混合，增加擺動的順暢度與微小扭動感
                    ctx.rotate(angle + (body.angle * 0.1));
                    ctx.fillText(body.char, 0, 0);
                    ctx.restore();
                }
            }
            requestAnimationFrame(renderLoop);
        }

        // 啟動流程與權限獲取
        function startExperience() {
            const overlay = document.getElementById('start-overlay');
            
            // 要求 iOS 陀螺儀權限 (必須由使用者點擊觸發)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                        }
                        // 隱藏開始畫面並啟動
                        overlay.style.opacity = '0';
                        setTimeout(() => { overlay.style.display = 'none'; init(); }, 500);
                    })
                    .catch(console.error);
            } else {
                // Android 或無支援的裝置直接啟動
                window.addEventListener('deviceorientation', handleOrientation);
                overlay.style.opacity = '0';
                setTimeout(() => { overlay.style.display = 'none'; init(); }, 500);
            }
        }

        // 確保 Google 字型載入完畢後再顯示啟動畫面
        document.fonts.ready.then(() => {
            document.getElementById('loading').style.display = 'none';
            
            const overlay = document.getElementById('start-overlay');
            overlay.style.display = 'flex';
            
            // 綁定第一次點擊啟動事件
            overlay.addEventListener('click', startExperience, { once: true });
        });
    </script>
</body>
</html>
