<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>doNotLiveInPoems | v2.1</title>
    <!-- 引入 Google Fonts: Chiron Sung HK -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chiron+Sung+HK&display=swap" rel="stylesheet">
    <!-- 引入 Matter.js 物理引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #313131; /* 網頁底色修改為深色 */
            touch-action: none; /* 防止在手機上滑動畫面 */
            font-family: 'Chiron Sung HK', serif;
        }
        /* 細雨畫布置於底層 */
        #rain-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none; /* 不干擾滑鼠/觸控事件 */
        }
        /* 詩句畫布置於上層 */
        #world {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            transition: opacity 0.25s ease-in-out; /* 新增漸變過渡 */
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #e584b4; /* 文字顏色修改為粉色 */
            font-size: 24pt;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 3;
        }
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #313131;
            z-index: 100;
            display: none; /* 預設隱藏，等字型載入後顯示 */
            justify-content: center;
            align-items: center;
            color: #e584b4;
            font-size: 20pt;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }
        .start-btn-container {
            position: relative;
            display: inline-block;
        }
        .underline-target {
            position: relative;
            display: inline-block;
        }
        .underline-target::after {
            content: '';
            position: absolute;
            top: calc(100% + 1px); /* 在文字底部下方 1px 的位置 */
            left: 0;
            width: 100%;
            height: 4px; /* 總高度4px：1px上橫線 + 2px間隙 + 1px下橫線 */
            border-top: 1px solid currentColor; /* currentColor 會自動跟隨文字顏色 #e584b4 */
            border-bottom: 1px solid currentColor;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div id="loading"> </div>
    <div id="start-overlay">
        <div class="start-btn-container">《<span class="underline-target">#請勿活在詩裡</span>》</div>
    </div>
    
    <!-- 兩層畫布，確保點擊過渡效果不影響細雨 -->
    <canvas id="rain-canvas"></canvas>
    <canvas id="world"></canvas>

    <script>
        // 初始化 Matter.js 模組
        const Engine = Matter.Engine,
              Render = Matter.Render,
              Runner = Matter.Runner,
              Bodies = Matter.Bodies,
              Composite = Matter.Composite,
              Constraint = Matter.Constraint,
              Mouse = Matter.Mouse,
              MouseConstraint = Matter.MouseConstraint,
              Events = Matter.Events,
              Body = Matter.Body;

        const engine = Engine.create();
        const world = engine.world;

        // 修正：將物理引擎的預設重力設定與陀螺儀的小重力同步，避免初始載入時過度拉扯下墜
        engine.gravity.x = 0;
        engine.gravity.y = 0.2;

        const canvas = document.getElementById('world');
        const ctx = canvas.getContext('2d');
        
        // 細雨專用畫布
        const rainCanvas = document.getElementById('rain-canvas');
        const rainCtx = rainCanvas.getContext('2d');

        // 詩句資料
        const originalSentences = [
            "雨水直接打進眼睛",
            "陽光普照得沒有陰影",
            "面朝大海，春暖花開",
            "難就難在生命",
            "並非詩句",
            "明明　還有更重要的事情",
            "我每天想著的淨是",
            "昨日的天氣"
        ];

        let linesData = [];
        let currentOrder = [0, 1, 2, 3, 4, 5, 6, 7];
        
        // 細雨資料
        let raindrops = [];
        let currentGx = 0; // 紀錄陀螺儀X軸偏移量，用於細雨方向

        // 判斷是否為手機版並設定文字大小與間距
        const isMobile = window.innerWidth <= 768;
        const ptToPx = 1.3333; // 1pt 約等於 1.3333px
        const fontSizePt = isMobile ? 18 : 20; 
        const fontSize = fontSizePt * ptToPx; // 轉換為 px
        const lineGap = isMobile ? 22 : 28; // 句子間隔
        const colWidth = fontSize + lineGap;

        // 初始化場景
        function init() {
            // 建立每個字元的物理剛體與約束 (繩索效果)
            for (let i = 0; i < originalSentences.length; i++) {
                let text = originalSentences[i];
                let bodies = [];
                let constraints = [];
                let prevBody = null;

                for (let j = 0; j < text.length; j++) {
                    let char = text[j];
                    
                    // 建立物理節點
                    let body = Bodies.circle(0, j * fontSize, fontSize * 0.45, {
                        collisionFilter: { group: -1 }, // 設為同群組且負數值，讓所有字不互碰以避免糾纏
                        frictionAir: 0.05, // 稍微增加一點空氣阻力讓擺動柔順
                        restitution: 0.1, // 降低彈性
                        isStatic: j === 0 // 第一個字固定不動
                    });
                    body.char = char;
                    bodies.push(body);
                    Composite.add(world, body);

                    // 綁定繩子(關節)
                    if (prevBody) {
                        let constraint = Constraint.create({
                            bodyA: prevBody,
                            bodyB: body,
                            length: fontSize * 0.9,
                            stiffness: 1, // 修改：設定極高硬度以防止字距拉長
                            damping: 0.1 // 提高阻尼避免抖動
                        });
                        constraints.push(constraint);
                        Composite.add(world, constraint);
                    }
                    prevBody = body;
                }
                linesData.push({ bodies, constraints });
            }

            // 移除舊有單點拖曳，加入大範圍滑動施力 (Swipe Force) 互動
            let pointerDownPos = null;
            let lastPointerPos = null;

            // 計算並施加滑動力道 (範圍約三句)
            function applySwipeForce(x, y, dx, dy) {
                const radius = colWidth * 3.5; // 影響半徑設定為大約 3 到 4 句的寬度
                const forceStrength = 0.00015; // 力道係數

                // 限制最大位移量，避免瞬間滑動太快導致力道爆炸
                const maxDelta = 50;
                dx = Math.max(-maxDelta, Math.min(maxDelta, dx));
                dy = Math.max(-maxDelta, Math.min(maxDelta, dy));

                for (let line of linesData) {
                    // 從 1 開始，避免移動到第一顆固定的錨點
                    for (let j = 1; j < line.bodies.length; j++) {
                        let body = line.bodies[j];
                        let dist = Math.hypot(body.position.x - x, body.position.y - y);

                        if (dist < radius) {
                            // 距離滑動軌跡越近，力量越強 (使用平方衰減讓邊緣過渡更柔和)
                            let falloff = 1 - (dist / radius);
                            falloff = falloff * falloff;
                            
                            Matter.Body.applyForce(body, body.position, {
                                x: dx * forceStrength * falloff * body.mass,
                                y: dy * forceStrength * falloff * body.mass
                            });
                        }
                    }
                }
            }

            // 滑鼠事件 (Hover 即可撥動)
            canvas.addEventListener('mousedown', e => {
                pointerDownPos = { x: e.clientX, y: e.clientY };
                lastPointerPos = { x: e.clientX, y: e.clientY };
            });
            canvas.addEventListener('mousemove', e => {
                if (lastPointerPos) {
                    let dx = e.clientX - lastPointerPos.x;
                    let dy = e.clientY - lastPointerPos.y;
                    if (dx !== 0 || dy !== 0) applySwipeForce(e.clientX, e.clientY, dx, dy);
                }
                lastPointerPos = { x: e.clientX, y: e.clientY };
            });
            canvas.addEventListener('mouseleave', () => lastPointerPos = null);
            canvas.addEventListener('mouseenter', e => lastPointerPos = { x: e.clientX, y: e.clientY });
            window.addEventListener('mouseup', e => {
                // 判斷是否為原地點擊
                if (pointerDownPos) {
                    let dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
                    if (dist < 10) handleScreenClick();
                }
                pointerDownPos = null;
            });

            // 觸控事件 (手指滑動撥動)
            canvas.addEventListener('touchstart', e => {
                let touch = e.touches[0];
                pointerDownPos = { x: touch.clientX, y: touch.clientY };
                lastPointerPos = { x: touch.clientX, y: touch.clientY };
            }, {passive: false});
            canvas.addEventListener('touchmove', e => {
                e.preventDefault(); // 阻止畫面跟著上下捲動
                let touch = e.touches[0];
                if (lastPointerPos) {
                    let dx = touch.clientX - lastPointerPos.x;
                    let dy = touch.clientY - lastPointerPos.y;
                    if (dx !== 0 || dy !== 0) applySwipeForce(touch.clientX, touch.clientY, dx, dy);
                }
                lastPointerPos = { x: touch.clientX, y: touch.clientY };
            }, {passive: false});
            window.addEventListener('touchend', e => {
                if (pointerDownPos && e.changedTouches) {
                    let touch = e.changedTouches[0];
                    let dist = Math.hypot(touch.clientX - pointerDownPos.x, touch.clientY - pointerDownPos.y);
                    if (dist < 10) handleScreenClick();
                }
                pointerDownPos = null;
            });

            // 初始佈局更新
            updateLayout();
            window.addEventListener('resize', updateLayout);

            // 加入微風效果與拖曳角度限制
            let windTime = 0;
            Events.on(engine, 'beforeUpdate', function() {
                windTime += 0.02;
                // 隨機微風力道 (由兩個正弦波疊加)，力道調弱至四分之一
                let windForceX = (Math.sin(windTime) * 0.0003 + Math.sin(windTime * 2.1) * 0.00015) * 0.25;
                let maxStretch = fontSize * 0.95; // 限制最大長度

                for (let line of linesData) {
                    let bodies = line.bodies;
                    for (let j = 1; j < bodies.length; j++) {
                        let prev = bodies[j-1];
                        let curr = bodies[j];

                        // --- 1. 施加隨機微風 ---
                        // 越下方的字元受風力影響越大
                        let forceMultiplier = j / bodies.length;
                        Matter.Body.applyForce(curr, curr.position, {
                            x: windForceX * forceMultiplier * curr.mass,
                            y: 0
                        });

                        // --- 2. 強制防拉長 (移除角度限制) ---
                        let dx = curr.position.x - prev.position.x;
                        let dy = curr.position.y - prev.position.y;
                        let angle = Math.atan2(dy, dx);
                        let dist = Math.sqrt(dx*dx + dy*dy);

                        // (已移除 60 度角度限制相關變數與邏輯)

                        let clampedDist = Math.min(dist, maxStretch);

                        // 若距離被限制(防拉長)，強制覆寫位置 (使用原始角度)
                        if (dist > clampedDist) {
                            Matter.Body.setPosition(curr, {
                                x: prev.position.x + Math.cos(angle) * clampedDist,
                                y: prev.position.y + Math.sin(angle) * clampedDist
                            });
                            // 稍微降低速度以減少因強制位移產生的物理抖動
                            Matter.Body.setVelocity(curr, { x: curr.velocity.x * 0.8, y: curr.velocity.y * 0.8 });
                        }
                    }
                }
            });

            // 啟動物理引擎計算與自定義繪製
            Runner.run(Runner.create(), engine);
            requestAnimationFrame(renderLoop);
        }

        // 陣列亂數排序 (Fisher-Yates Shuffle)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // 點擊螢幕觸發功能 (包含要求 iOS 陀螺儀權限)
        function handleScreenClick() {
            // 加入淡出淡入轉場效果 (Fade out 保持 0.25s -> Shuffle -> Fade in 延長為 0.5s)
            // 由於只針對 #world 畫布設定，細雨畫布 #rain-canvas 不受影響
            canvas.style.transitionDuration = '0.25s';
            canvas.style.opacity = '0';
            setTimeout(() => {
                shuffleArray(currentOrder);
                updateLayout();
                canvas.style.transitionDuration = '0.5s';
                canvas.style.opacity = '1';
            }, 250); // 250ms 消失後執行
        }

        // 陀螺儀重力處理
        function handleOrientation(event) {
            let gamma = event.gamma || 0; // 左右傾斜
            let beta = event.beta || 0;  // 前後傾斜

            let gx = gamma / 45; 
            let gy = beta / 45;

            // 調整門簾擺動的靈敏度與最大值
            gx = Math.max(-1.5, Math.min(1.5, gx));
            gy = Math.max(-1.5, Math.min(1.5, gy));
            
            // 儲存 X 軸偏移供背景細雨使用
            currentGx = gx;

            engine.world.gravity.x = gx * 1.5;
            // 確保重力大致向下，避免整個飛上去
            engine.world.gravity.y = gy > 0 ? Math.max(0.2, gy * 1.5) : 0.2; 
        }

        // 根據直/橫畫面重新排列所有詩句的定位
        function updateLayout() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const pixelRatio = window.devicePixelRatio || 1;

            // 設定詩句畫布解析度
            canvas.width = w * pixelRatio;
            canvas.height = h * pixelRatio;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            ctx.scale(pixelRatio, pixelRatio);
            
            // 設定細雨畫布解析度
            rainCanvas.width = w * pixelRatio;
            rainCanvas.height = h * pixelRatio;
            rainCanvas.style.width = w + 'px';
            rainCanvas.style.height = h + 'px';
            rainCtx.scale(pixelRatio, pixelRatio);

            let isPortrait = h >= w;

            if (!isPortrait) {
                // 橫畫面：8句集中於正中央
                let totalCols = 8;
                let totalWidth = totalCols * fontSize + (totalCols - 1) * lineGap;
                let maxLen = Math.max(...currentOrder.map(i => originalSentences[i].length));
                let blockHeight = maxLen * fontSize;

                let startX = w / 2 + totalWidth / 2 - fontSize / 2;
                let startY = h / 2 - blockHeight / 2 + fontSize / 2;

                for (let i = 0; i < 8; i++) {
                    let lineIdx = currentOrder[i];
                    let targetX = startX - i * colWidth;
                    let targetY = startY;
                    moveLine(lineIdx, targetX, targetY);
                }
            } else {
                // 直畫面：上下兩半，各4句
                // 上半部 4 句
                let topGroup = currentOrder.slice(0, 4);
                let maxLenTop = Math.max(...topGroup.map(i => originalSentences[i].length));
                let topBlockHeight = maxLenTop * fontSize;
                let topTotalWidth = 4 * fontSize + 3 * lineGap;
                let topStartX = w / 2 + topTotalWidth / 2 - fontSize / 2;
                let topStartY = h / 4 - topBlockHeight / 2 + fontSize / 2;

                for (let i = 0; i < 4; i++) {
                    let lineIdx = topGroup[i];
                    let targetX = topStartX - i * colWidth;
                    let targetY = topStartY;
                    moveLine(lineIdx, targetX, targetY);
                }

                // 下半部 4 句
                let botGroup = currentOrder.slice(4, 8);
                let maxLenBot = Math.max(...botGroup.map(i => originalSentences[i].length));
                let botBlockHeight = maxLenBot * fontSize;
                let botTotalWidth = 4 * fontSize + 3 * lineGap;
                let botStartX = w / 2 + botTotalWidth / 2 - fontSize / 2;
                let botStartY = (h * 3) / 4 - botBlockHeight / 2 + fontSize / 2;

                for (let i = 0; i < 4; i++) {
                    let lineIdx = botGroup[i];
                    let targetX = botStartX - i * colWidth;
                    let targetY = botStartY;
                    moveLine(lineIdx, targetX, targetY);
                }
            }
        }

        // 平順地將整句移動到新位置 (避免約束爆炸)
        function moveLine(lineIdx, targetX, targetY) {
            let bodies = linesData[lineIdx].bodies;
            let anchor = bodies[0];
            let dx = targetX - anchor.position.x;
            let dy = targetY - anchor.position.y;

            for (let body of bodies) {
                Body.setPosition(body, {
                    x: body.position.x + dx,
                    y: body.position.y + dy
                });
                Body.setVelocity(body, { x: 0, y: 0 }); // 消除亂數調換時產生的暴衝速度
                Body.setAngularVelocity(body, 0);
            }
        }

        // 自定義畫面繪製
        function renderLoop() {
            const w = window.innerWidth;
            const h = window.innerHeight;

            ctx.clearRect(0, 0, w, h);
            rainCtx.clearRect(0, 0, w, h);

            // =========================
            // 繪製背景：下雨效果
            // =========================
            rainCtx.strokeStyle = '#e584b4';
            rainCtx.lineWidth = 1;
            rainCtx.beginPath();
            
            // 隨機生成新的雨滴 (控制密度)
            let dropsPerFrame = isMobile ? 1 : 2;
            for(let k = 0; k < dropsPerFrame; k++) {
                if(Math.random() < 0.6) {
                    raindrops.push({
                        // 為了應付陀螺儀帶來的劇烈偏移，將生成範圍擴大到螢幕外
                        x: Math.random() * (w * 1.5) - (w * 0.25),
                        y: -60, // 因應長度增加，將生成點再往上拉高
                        length: Math.random() * 49 + 1, // 長度限制改為 1px ~ 50px
                        speed: Math.random() * 3 + 3  // 墜落速度減慢至原本的一半 (從 6~12 降為 3~6)
                    });
                }
            }

            // 產生微微的自然風，讓沒有陀螺儀的設備也能看到飄動的視覺效果
            let baseWind = Math.sin(Date.now() * 0.0005) * 1.5 + Math.sin(Date.now() * 0.0002) * 0.5;

            // 更新並繪製所有雨滴
            for (let i = raindrops.length - 1; i >= 0; i--) {
                let drop = raindrops[i];
                
                // 受陀螺儀影響的 X 軸偏移量 + 預設自然微風
                let vx = currentGx * 15 + baseWind; 
                let vy = drop.speed;
                
                drop.x += vx;
                drop.y += vy;
                
                // 計算線條角度，使其頭尾對齊墜落方向
                let angle = Math.atan2(vy, vx);
                let endX = drop.x - Math.cos(angle) * drop.length;
                let endY = drop.y - Math.sin(angle) * drop.length;
                
                rainCtx.moveTo(drop.x, drop.y);
                rainCtx.lineTo(endX, endY);
                
                // 移除離開畫面太遠的雨滴
                if (drop.y > h + 50 || drop.x < -100 || drop.x > w + 100) {
                    raindrops.splice(i, 1);
                }
            }
            rainCtx.stroke();


            // =========================
            // 繪製前景：文字門簾
            // =========================
            ctx.font = `400 ${fontSizePt}pt "Chiron Sung HK", serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            for (let line of linesData) {
                let bodies = line.bodies;
                for (let j = 0; j < bodies.length; j++) {
                    let body = bodies[j];
                    let angle = 0;
                    
                    // 根據上下文字的相對位置計算旋轉角度，讓文字順著繩子方向排
                    if (j < bodies.length - 1) {
                        let nextBody = bodies[j+1];
                        angle = Math.atan2(nextBody.position.y - body.position.y, nextBody.position.x - body.position.x) - Math.PI / 2;
                    } else if (j > 0) {
                        let prevBody = bodies[j-1];
                        angle = Math.atan2(body.position.y - prevBody.position.y, body.position.x - prevBody.position.x) - Math.PI / 2;
                    }

                    let finalAngle = angle + (body.angle * 0.1);

                    ctx.save();
                    ctx.translate(body.position.x, body.position.y);
                    ctx.rotate(finalAngle);
                    ctx.fillStyle = '#e584b4';
                    ctx.fillText(body.char, 0, 0);
                    ctx.restore();
                }
            }
            requestAnimationFrame(renderLoop);
        }

        // 啟動流程與權限獲取
        function startExperience() {
            const overlay = document.getElementById('start-overlay');
            
            // 要求 iOS 陀螺儀權限 (必須由使用者點擊觸發)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                        }
                        // 隱藏開始畫面並啟動
                        overlay.style.opacity = '0';
                        setTimeout(() => { overlay.style.display = 'none'; init(); }, 500);
                    })
                    .catch(console.error);
            } else {
                // Android 或無支援的裝置直接啟動
                window.addEventListener('deviceorientation', handleOrientation);
                overlay.style.opacity = '0';
                setTimeout(() => { overlay.style.display = 'none'; init(); }, 500);
            }
        }

        // 確保 Google 字型載入完畢後再顯示啟動畫面
        document.fonts.ready.then(() => {
            document.getElementById('loading').style.display = 'none';
            
            const overlay = document.getElementById('start-overlay');
            overlay.style.display = 'flex';
            
            // 綁定第一次點擊啟動事件
            overlay.addEventListener('click', startExperience, { once: true });
        });
    </script>
</body>
</html>
